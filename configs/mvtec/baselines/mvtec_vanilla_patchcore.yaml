experiment:
  name: mvtec_vanilla_patchcore
  seed: 0

paths:
  output_root: results/mvtec

runtime:
  device: cpu

pipeline:
  training:
    contract: OFFLINE # OFFLINE | STREAMING
    fit_epochs:
      feature_agg: 1
      proj1: 1
      transform: 1
      proj2: 1
      mem_agg: 1
  slots:
    dataloader:
      plugin: mvtec_dataloader_augment
      params:
        dataset_root: mvtec_datasets
        categories:
          - bottle
          - cable
          - capsule
          - carpet
          - grid
          - hazelnut
          - leather
          - metal_nut
          - pill
          - screw
          - tile
          - toothbrush
          - transistor
          - wood
          - zipper
        batch_size: 16
        num_workers: 8
        img_size: [224, 224]
        train_augment_enabled: false  # augmentation subtree intentionally omitted
    backbone:
      plugin: pretrained_backbone
      params:
        backbone: wideresnet50
        embedding_layers: [layer2, layer3]
    patch_align:
      plugin: pc_patchify_align
      params:
        patchsize: 3
        patchstride: 1
    preprocess:
      plugin: pc_preprocess
      params:
        pretrain_embed_dimension: 1024
    feature_agg:
      plugin: none
      params:
        target_embed_dimension: 1024
    proj1:
      plugin: none
      params: {}
    transform:
      plugin: none
      params: {}
    proj2:
      plugin: none
      params: {}
    mem_agg:
      plugin: greedy
      params:
        coreset_percentage: 0.1
    materialize:
      plugin: greedy
      params: {}
    distance:
      plugin: euclidean_nn
      params:
        k: 1
    scoring:
      plugin: reference_max
      params:
        patch_scoring:
          mode: GLOBAL_ONLY # explicit default

evaluation:
  threshold_policy:
    image: best_f1_per_dataset # best_f1_per_dataset | fixed_0_5
    pixel: best_f1_per_dataset # best_f1_per_dataset | fixed_0_5
  calibration:
    mode: none # none | zscore | ecdf
    eps: 1.0e-12
    apply_to_image: true
    apply_to_pixel: true
  pixel_metrics:
    aupro:
      image_enabled: true
      pixel_enabled: false
      max_fpr: 0.30
      num_thresholds: 256

artifacts:
  enabled: true
  split: test # test
  save_mode: all # all | anomalous | top_k
  max_images_per_dataset: null
  overlay_alpha: 0.55

render:
  progress:
    enabled: true # true | false
    leave: true # true | false
    dynamic_ncols: true # true | false
    min_interval: 0.1 # > 0 seconds between refreshes
  logging:
    level: INFO # DEBUG | INFO | WARNING | ERROR | CRITICAL
